version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "4006:4006"
    env_file:
      - .env
    volumes:
      # Mount source code for development (optional - remove in production)
      - ./src:/app/src
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
    restart: unless-stopped
    container_name: skaftin-backend
    networks:
      - skaftin-network
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3006:3006"
    volumes:
      # Mount source code for development (optional - remove in production)
      - ./frontend/src:/app/src
      - ./frontend/package.json:/app/package.json
      - ./frontend/vite.config.ts:/app/vite.config.ts
    restart: unless-stopped
    container_name: skaftin-frontend
    networks:
      - skaftin-network
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    ports:
      - "5450:5432"
    environment:
      POSTGRES_DB: skaftin_db
      POSTGRES_USER: skaftin_user
      POSTGRES_PASSWORD: skaftin_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    container_name: skaftin-postgres
    networks:
      - skaftin-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skaftin_user -d skaftin_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  skaftin-network:
    driver: bridge
