version: '3.8'

services:
  backend:
    image: dr.bobosoftware.co.za/skaftin-platform:latest
    ports:
      - "4006:4006"
    env_file:
      - .env
    restart: unless-stopped
    container_name: skaftin-backend
    networks:
      - skaftin-network
    depends_on:
      - postgres

  frontend:
    image: dr.bobosoftware.co.za/skaftin-frontend:latest
    ports:
      - "3006:3006"
    restart: unless-stopped
    container_name: skaftin-frontend
    networks:
      - skaftin-network
    depends_on:
      - backend

  postgres:
    image: postgres:17-alpine
    ports:
      - "5440:5440"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skaftin_db}
      POSTGRES_USER: ${POSTGRES_USER:-skaftin_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skaftin_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    container_name: skaftin-postgres
    networks:
      - skaftin-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skaftin_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  skaftin-network:
    driver: bridge

volumes:
  postgres_data:
