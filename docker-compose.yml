version: '3.8'

services:
  # SuperTokens Core Service
  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:10.0
    container_name: skaftin-supertokens
    depends_on:
      - postgres
    ports:
      - "3567:3567"
    environment:
      # PostgreSQL connection
      POSTGRESQL_CONNECTION_URI: "postgresql://postgres:BLUcabish%2325@postgres:5432/skaftin_db"
      POSTGRESQL_TABLE_SCHEMA: supertokens
      
      # API keys (optional but recommended for production)
      API_KEYS: ${SUPERTOKENS_API_KEY:-your-api-key-change-in-production}
      
      # Disable telemetry (optional)
      DISABLE_TELEMETRY: "true"
      
      # Log level
      LOG_LEVEL: info
      
      # Password reset token expires after 15 minutes (in milliseconds)
      PASSWORD_RESET_TOKEN_LIFETIME: 900000
    networks:
      - skaftin-network
    restart: unless-stopped
    healthcheck:
      test: >
        bash -c 'exec 3<>/dev/tcp/127.0.0.1/3567 && echo -e "GET /hello HTTP/1.1\r\nhost: 127.0.0.1:3567\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep "Hello"'
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Database (if not already running)
  postgres:
    image: postgres:17-alpine
    container_name: skaftin-postgres
    ports:
      - "5440:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: BLUcabish#25
      POSTGRES_DB: skaftin_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - skaftin-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Storage (if not already running)
  minio:
    image: minio/minio:latest
    container_name: skaftin-minio
    ports:
      - "9020:9000"
      - "9021:9001"
    environment:
      MINIO_ROOT_USER: minio_user
      MINIO_ROOT_PASSWORD: laksdflaksdjflk
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - skaftin-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Go API Gateway (public-facing entry point)
  go-service:
    build:
      context: ./go-services
      dockerfile: Dockerfile
    container_name: skaftin-go-service
    ports:
      - "4006:4006"
    environment:
      PORT: 4006
      AUTO_START_NODE: "false"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: skaftin_db
      DB_USER: postgres
      DB_PASSWORD: BLUcabish#25
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio_user
      MINIO_SECRET_KEY: laksdflaksdjflk
      NODE_BACKEND_URL: http://node-backend:4007
      SUPERTOKENS_CORE_URL: http://supertokens:3567
    networks:
      - skaftin-network
    depends_on:
      postgres:
        condition: service_healthy
      node-backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4006/api/v2/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js Backend (internal, proxied via Go gateway)
  node-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skaftin-node-backend
    expose:
      - "4007"
    environment:
      BACKEND_PORT: 4007
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: skaftin_db
      DB_USER: postgres
      DB_PASSWORD: BLUcabish#25
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio_user
      MINIO_SECRET_KEY: laksdflaksdjflk
      SUPERTOKENS_CONNECTION_URI: http://supertokens:3567
    networks:
      - skaftin-network
    depends_on:
      postgres:
        condition: service_healthy
      supertokens:
        condition: service_healthy
    restart: unless-stopped

networks:
  skaftin-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  minio-data:
    driver: local

