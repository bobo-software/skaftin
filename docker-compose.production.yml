version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: skaftin-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-BLUcabish#25}
      POSTGRES_DB: ${DB_NAME:-postgres}
    ports:
      - "5434:5432"  # Use different port to avoid conflict
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - skaftin-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: skaftin-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-laksdflaksdjflk}
    ports:
      - "9002:9000"  # API
      - "9003:9001"  # Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - skaftin-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO Client (for creating buckets)
  minio-create-bucket:
    image: minio/mc:latest
    container_name: skaftin-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc config host add myminio http://minio:9000 minio_user laksdflaksdjflk) do sleep 1; done &&
      /usr/bin/mc mb myminio/skaftin || true &&
      /usr/bin/mc policy set public myminio/skaftin || true &&
      exit 0;
      "
    networks:
      - skaftin-network

  # SuperTokens Core
  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:latest
    container_name: skaftin-supertokens
    environment:
      POSTGRESQL_CONNECTION_URI: postgresql://postgres:${DB_PASSWORD:-BLUcabish#25}@postgres:5432/${DB_NAME:-postgres}
      API_KEYS: ${SUPERTOKENS_API_KEY:-dev-api-key-change-in-production}
    ports:
      - "3568:3567"  # Use different port
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - skaftin-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3567/hello"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Unified Skaftin Application (Frontend + Backend) - Production
  skaftin-app:
    image: skaftin-unified-debug
    container_name: skaftin-unified-prod
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-BLUcabish#25}
      DB_NAME: ${DB_NAME:-postgres}
      SUPERTOKENS_CONNECTION_URI: http://supertokens:3567
      SUPERTOKENS_API_KEY: ${SUPERTOKENS_API_KEY:-dev-api-key-change-in-production}
      BACKEND_PORT: 4005
      FRONTEND_URL: ${FRONTEND_URL:-http://102.218.215.251:3005}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio_user}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-laksdflaksdjflk}
      MINIO_USE_SSL: "false"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      JWT_SECRET: skaftin-prod-jwt-secret-2024-secure-deployment
    ports:
      - "3005:3005"  # Frontend
      - "4005:4005"  # Backend API
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      supertokens:
        condition: service_healthy
    networks:
      - skaftin-network
    volumes:
      - skaftin_logs:/app/logs
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  skaftin_logs:
    driver: local

networks:
  skaftin-network:
    driver: bridge