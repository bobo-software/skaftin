name: Build and Push Docker Images

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub (to avoid rate limits)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Login to Custom Docker Registry
        uses: docker/login-action@v3
        with:
          registry: https://dr.bobosoftware.co.za
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version from commit SHA
        run: echo "VERSION=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: |
            dr.bobosoftware.co.za/skaftin-frontend:latest
            dr.bobosoftware.co.za/skaftin-frontend:${{ env.VERSION }}

      - name: Build and push Go Service Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./go-services
          file: ./go-services/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            dr.bobosoftware.co.za/skaftin-go-service:latest
            dr.bobosoftware.co.za/skaftin-go-service:${{ env.VERSION }}
