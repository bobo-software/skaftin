name: CI/CD Pipeline with Custom Docker Registry

on:
  push:
    branches:
      - main  # Trigger the workflow on push to the main branch
    tags:
      - 'v*.*.*'  # Trigger the workflow on tag events matching v*.*.*

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to Custom Docker Registry
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login https://dr.bobosoftware.co.za -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Set branch tag
        if: startsWith(github.ref, 'refs/heads/')
        run: echo "BRANCH_TAG=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: |
            dr.bobosoftware.co.za/skaftin-platform:latest
            ${{ env.VERSION && format('dr.bobosoftware.co.za/skaftin-platform:{0}', env.VERSION) || format('dr.bobosoftware.co.za/skaftin-platform:{0}', env.BRANCH_TAG) }}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v2
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: |
            dr.bobosoftware.co.za/skaftin-frontend:latest
            ${{ env.VERSION && format('dr.bobosoftware.co.za/skaftin-frontend:{0}', env.VERSION) || format('dr.bobosoftware.co.za/skaftin-frontend:{0}', env.BRANCH_TAG) }}
