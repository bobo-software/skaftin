name: CI/CD Pipeline with Custom Docker Registry

on:
  push:
    branches:
      - main  # Trigger the workflow on push to the main branch
    tags:
      - 'v*.*.*'  # Trigger the workflow on tag events matching v*.*.*
  pull_request:
    branches:
      - main

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Custom Docker Registry
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login dr.bobosoftware.co.za -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Set branch tag
        if: startsWith(github.ref, 'refs/heads/')
        run: echo "BRANCH_TAG=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV

      - name: Set PR tag
        if: github.event_name == 'pull_request'
        run: echo "PR_TAG=pr-${{ github.event.pull_request.number }}" >> $GITHUB_ENV

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            dr.bobosoftware.co.za/skaftin-backend:latest
            ${{ env.VERSION && format('dr.bobosoftware.co.za/skaftin-backend:{0}', env.VERSION) || '' }}
            ${{ env.BRANCH_TAG && format('dr.bobosoftware.co.za/skaftin-backend:{0}', env.BRANCH_TAG) || '' }}
            ${{ env.PR_TAG && format('dr.bobosoftware.co.za/skaftin-backend:{0}', env.PR_TAG) || '' }}
          cache-from: type=registry,ref=dr.bobosoftware.co.za/skaftin-backend:buildcache
          cache-to: type=registry,ref=dr.bobosoftware.co.za/skaftin-backend:buildcache,mode=max
          platforms: linux/amd64,linux/arm64

  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Custom Docker Registry
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login dr.bobosoftware.co.za -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Set branch tag
        if: startsWith(github.ref, 'refs/heads/')
        run: echo "BRANCH_TAG=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV

      - name: Set PR tag
        if: github.event_name == 'pull_request'
        run: echo "PR_TAG=pr-${{ github.event.pull_request.number }}" >> $GITHUB_ENV

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            dr.bobosoftware.co.za/skaftin-frontend:latest
            ${{ env.VERSION && format('dr.bobosoftware.co.za/skaftin-frontend:{0}', env.VERSION) || '' }}
            ${{ env.BRANCH_TAG && format('dr.bobosoftware.co.za/skaftin-frontend:{0}', env.BRANCH_TAG) || '' }}
            ${{ env.PR_TAG && format('dr.bobosoftware.co.za/skaftin-frontend:{0}', env.PR_TAG) || '' }}
          cache-from: type=registry,ref=dr.bobosoftware.co.za/skaftin-frontend:buildcache
          cache-to: type=registry,ref=dr.bobosoftware.co.za/skaftin-frontend:buildcache,mode=max
          platforms: linux/amd64,linux/arm64

  notify:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Notify on failure
        if: failure()
        run: echo "One or more build jobs failed"
