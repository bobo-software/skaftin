version: '3.8'

services:
  backend:
    image: dr.bobosoftware.co.za/skaftin-platform:latest
    ports:
      - "4006:4006"
    env_file:
      - .env
    restart: unless-stopped
    container_name: skaftin-backend
    networks:
      - skaftin-network
    # Health check to ensure service is running
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4006/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: dr.bobosoftware.co.za/skaftin-frontend:latest
    ports:
      - "3006:3006"
    restart: unless-stopped
    container_name: skaftin-frontend
    networks:
      - skaftin-network
    depends_on:
      - backend
    # Health check for frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3006/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:17-alpine
    ports:
      - "5450:5432"
    environment:
      POSTGRES_DB: skaftin_db
      POSTGRES_USER: skaftin_user
      POSTGRES_PASSWORD: skaftin_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    container_name: skaftin-postgres
    networks:
      - skaftin-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skaftin_user -d skaftin_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"  # API port
      - "9001:9001"  # Console port
    environment:
      MINIO_ROOT_USER: skaftin_minio
      MINIO_ROOT_PASSWORD: skaftin_minio_password
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    container_name: skaftin-minio
    networks:
      - skaftin-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  postgres_data:
  minio_data:

networks:
  skaftin-network:
    driver: bridge
